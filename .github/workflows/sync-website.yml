name: Sync the conversion files to the website

# The web version of MatTalX (mattalx.org/web-version/) runs the very same core.js and
# completion.js as the extension and the add-on. Rather than copying them by hand, which
# is how core.js fell two years behind before, this opens a pull request on the website
# whenever either one changes.
#
# Both files know nothing about the DOM, which is what makes them safe to share: core.js
# converts, completion.js decides what to suggest, and each interface draws the result
# its own way. js/web-version.js is the website's own and is never touched here.
#
# Needs a WEBSITE_TOKEN secret: a fine-grained personal access token on samueleblanc/MatTalX_website
# with "Contents: read and write" and "Pull requests: read and write".

on:
  push:
    branches: [master]
    paths:
      - "common/core.js"
      - "common/completion.js"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MatTalX
        uses: actions/checkout@v4
        with:
          path: mattalx

      - name: Checkout the website
        uses: actions/checkout@v4
        with:
          repository: samueleblanc/MatTalX_website
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: website

      - name: Copy the shared files
        run: |
          cp mattalx/common/core.js website/js/core.js
          cp mattalx/common/completion.js website/js/completion.js

      - name: Open a pull request on the website
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: website
          branch: sync-core
          delete-branch: true
          commit-message: "sync core.js and completion.js from the extension"
          title: "Update core.js and completion.js from the extension"
          body: |
            `js/core.js` and `js/completion.js` copied from
            [MatTalX@${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            Opened automatically because one of them changed in the extension. Nothing else
            is touched: `js/web-version.js` is the website's own interface and stays as it is.
