name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Convert every command and compare with the snapshot
        run: npm run test:all

  build:
    name: Build the extension and the add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          bash build.sh chrome
          bash build.sh firefox
      - name: Check the add-on the way addons.mozilla.org does
        run: npx --yes web-ext lint --source-dir firefox_add_on
